name: Go toolchain for the golang.go stock extension suites
description: >-
  Installs Go (actions/setup-go), restores the module and build caches and puts
  gopls into the fixture's GOBIN (node_modules/.cache/diode-go-fixture/bin). Without Go
  the golang.go suites (extensionHost.goLsp*, e2e goLsp, the go-lsp scenario) are
  skipped explicitly; without the cache every run would build gopls over the network.
  Call after `npm install`.

runs:
  using: composite
  steps:
    # Latest stable: neither the stock extension nor gopls@latest pins a Go version, so we don't either.
    - uses: actions/setup-go@v5
      with:
        go-version: stable
        # setup-go's built-in cache is keyed on go.sum, which this repo doesn't have.
        cache: false

    # Keys carry the month so gopls@latest doesn't freeze at the first built
    # version: a fresh one is built once a month. Hence the gopls cache has no
    # restore-keys, while the module and build caches fall back to last month, so the build isn't from scratch.
    - name: Go tools cache key
      id: key
      shell: bash
      run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-mod-${{ runner.os }}-${{ steps.key.outputs.month }}
        restore-keys: |
          go-mod-${{ runner.os }}-

    - id: gopls
      uses: actions/cache/restore@v4
      with:
        path: node_modules/.cache/diode-go-fixture
        key: go-gopls-${{ runner.os }}-${{ steps.key.outputs.month }}

    # gopls is built here, not in the fixture's `ensureGopls`: the build takes minutes, and
    # inside tests it ate the mutation gate's initial test run budget.
    # Same path as the fixture's, so `ensureGopls` finds the prebuilt one.
    - name: Build gopls
      if: steps.gopls.outputs.cache-hit != 'true'
      shell: bash
      run: GOBIN="$PWD/node_modules/.cache/diode-go-fixture/bin" go install golang.org/x/tools/gopls@latest

    # Save explicitly right after the build: the actions/cache post step writes the cache
    # only when the job is green, so a red run would rebuild gopls next time.
    - if: steps.gopls.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: node_modules/.cache/diode-go-fixture
        key: go-gopls-${{ runner.os }}-${{ steps.key.outputs.month }}
