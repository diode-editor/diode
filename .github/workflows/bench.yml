# Open-file benchmark (e2e/bench/benchOpen.ts) on CI.
#
# Numbers from a shared runner are noisy, so the job gates nothing: it takes a
# report and puts it into the `bench-data` data branch (scripts/bench-publish.mjs):
# the run's raw JSON, latest.json/latest.md and the run index. The page
# https://diode-editor.github.io/benchmarks/ reads this branch via
# raw.githubusercontent.com and draws the latest run and the run history.
#
# The report used to be opened as a PR into docs/public, but Actions in this repo
# can't create PRs (an org setting), and both runs failed at the last step.
# Pushing to the data branch needs only the workflow's own `contents: write`.
# Noisy runs aren't filtered by hand: the report marks a row as noisy by IQR
# itself, and the page shows the median of recent runs next to the latest one.
name: Bench

on:
  workflow_dispatch:
  # On every push to main: several features land per day, and a weekly run
  # didn't show which commit moved startup. A run takes ~6 min; the repo is public.
  # Docs-only changes don't move the numbers.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: write

# Runs aren't cancelled (cancel-in-progress: false), but GitHub keeps only one pending
# run in the group's queue: a series of pushes during a run collapses into one
# run on the freshest head of main.
concurrency:
  group: bench-data
  cancel-in-progress: false

jobs:
  bench-open:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # node-pty builds from source when there is no prebuild for the current
      # Node version (same caveat as in ci.yml / e2e).
      - name: Install build deps for node-pty
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3

      - run: npm install

      - run: npm run build:sea

      - name: Run open-file benchmark
        run: npm run bench:open -- --md="$RUNNER_TEMP/BENCH-OPEN.md" --json="$RUNNER_TEMP/open.json"
        env:
          DIODE_E2E_BINARY: ${{ github.workspace }}/dist/diode

      - name: Publish to the bench-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The data branch is an orphan with no history shared with main; the first run
          # creates it from an empty tree, later runs append to it.
          if git fetch origin bench-data:bench-data 2>/dev/null; then
            echo "bench-data: continuing the history"
          else
            empty=$(git hash-object -t tree /dev/null)
            git branch bench-data "$(git commit-tree "$empty" -m "bench-data: benchmark data branch")"
            echo "bench-data: created"
          fi
          git worktree add "$RUNNER_TEMP/bench-data" bench-data
          node scripts/bench-publish.mjs --report "$RUNNER_TEMP/open.json" --md "$RUNNER_TEMP/BENCH-OPEN.md" --out "$RUNNER_TEMP/bench-data"
          cd "$RUNNER_TEMP/bench-data"
          git add -A
          git commit -m "bench(open): $(date -u +%Y-%m-%d) @ ${GITHUB_SHA::12} (run ${{ github.run_id }})"
          git push origin bench-data

      - name: Attach the report to the run
        uses: actions/upload-artifact@v4
        with:
          name: bench-open-report
          path: |
            ${{ runner.temp }}/open.json
            ${{ runner.temp }}/BENCH-OPEN.md
