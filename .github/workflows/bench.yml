# Бенчмарк открытия файла (e2e/bench/benchOpen.ts) на CI.
#
# Цифры со shared-раннера шумные, поэтому джоба ничего не гейтит — она снимает
# отчёт и кладёт его в ветку данных `bench-data` (scripts/bench-publish.mjs):
# сырой JSON прогона, latest.json/latest.md и индекс прогонов. Страница
# https://diode-editor.github.io/benchmarks/ читает эту ветку через
# raw.githubusercontent.com и рисует последний прогон и историю по неделям.
#
# Раньше отчёт открывался PR-ом в docs/public — Actions в этом репозитории не
# может создавать PR (настройка организации), и оба прогона падали на последнем
# шаге. Пуш в ветку данных требует только `contents: write` самого воркфлоу.
# Шумные прогоны не отсеиваются руками: отчёт сам помечает строку «шумно» по
# IQR, а страница показывает медиану по последним прогонам рядом с последним.
name: Bench

on:
  workflow_dispatch:
  schedule:
    # Раз в неделю: чаще цифры читать некому.
    - cron: '0 4 * * 1'

permissions:
  contents: write

concurrency:
  group: bench-data
  cancel-in-progress: false

jobs:
  bench-open:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '25'

      # node-pty собирается из исходников, если для текущей версии Node нет
      # prebuild (та же оговорка, что в ci.yml / e2e).
      - name: Install build deps for node-pty
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3

      - run: npm install

      - run: npm run build:sea

      - name: Run open-file benchmark
        run: npm run bench:open -- --md="$RUNNER_TEMP/BENCH-OPEN.md" --json="$RUNNER_TEMP/open.json"
        env:
          DIODE_E2E_BINARY: ${{ github.workspace }}/dist/diode

      - name: Publish to the bench-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Ветка данных — сирота без общей истории с main; первый прогон создаёт
          # её от пустого дерева, дальше — дописывает.
          if git fetch origin bench-data:bench-data 2>/dev/null; then
            echo "bench-data: продолжаем историю"
          else
            empty=$(git hash-object -t tree /dev/null)
            git branch bench-data "$(git commit-tree "$empty" -m "bench-data: ветка данных бенчмарков")"
            echo "bench-data: создана"
          fi
          git worktree add "$RUNNER_TEMP/bench-data" bench-data
          node scripts/bench-publish.mjs --report "$RUNNER_TEMP/open.json" --md "$RUNNER_TEMP/BENCH-OPEN.md" --out "$RUNNER_TEMP/bench-data"
          cd "$RUNNER_TEMP/bench-data"
          git add -A
          git commit -m "bench(open): $(date -u +%Y-%m-%d) @ ${GITHUB_SHA::12} (run ${{ github.run_id }})"
          git push origin bench-data

      - name: Attach the report to the run
        uses: actions/upload-artifact@v4
        with:
          name: bench-open-report
          path: |
            ${{ runner.temp }}/open.json
            ${{ runner.temp }}/BENCH-OPEN.md
