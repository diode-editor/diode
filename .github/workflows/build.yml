name: Build SEA

# Reusable build of the binaries (SEA) for all platforms.
# Called from release.yml and nightly.yml via `workflow_call`,
# and can also be run by hand via `workflow_dispatch`.
on:
  workflow_call:
    inputs:
      version:
        description: "Version baked into the binary (release: vX.Y.Z; nightly: nightly-<hash>)"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version baked into the binary (release: vX.Y.Z; nightly: nightly-<hash>)"
        required: false
        type: string

jobs:
  build:
    strategy:
      matrix:
        # mode: how we package.
        #   sea         — Node SEA (`node --build-sea`). The default on all platforms:
        #                 the core's V8 snapshot (#620) is possible only in SEA.
        #   selfextract — an sh stub + an appended payload (untouched node + main.cjs +
        #                 diode.bundle). Intel macOS only: there node can't build a
        #                 working SEA, blob injection breaks the Mach-O chained fixups
        #                 → segfault before main() (#143, #144). The price of SEA on linux
        #                 is a ~150 MB binary vs ~48 for selfextract; accepted for the
        #                 snapshot (decision 2026-10-15).
        # linux-arm64 (Raspberry Pi 3/4/5 on a 64-bit OS) builds on a native
        # arm runner: npm install compiles node-pty and fetches ripgrep for its
        # architecture, and the smoke test runs on real arm64.
        include:
          - os: ubuntu-latest
            asset: diode-linux-x64
            binary: dist/diode
            mode: sea
          - os: ubuntu-24.04-arm
            asset: diode-linux-arm64
            binary: dist/diode
            mode: sea
          - os: macos-latest
            asset: diode-macos-arm64
            binary: dist/diode
            mode: sea
          - os: macos-15-intel
            asset: diode-macos-x64
            binary: dist/diode
            mode: selfextract
          - os: windows-latest
            asset: diode-windows-x64.exe
            binary: dist/diode.exe
            mode: sea

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # The build node version. For mode: selfextract keep it in lockstep with
      # NODE_VERSION in scripts/build-selfextract.mjs: that node goes into
      # the payload and becomes the user's runtime.
      # An exact version (.nvmrc), not a major: in a process started from a V8 snapshot (SEA `useSnapshot`)
      # node before 26.11 crashes a worker that uses `node:net`/`http`/`v8` (SIGABRT
      # `shutdown_wrap_template_.IsEmpty()`), and setup-node with a major may pick
      # an old 26.x from the runner's cache.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm install

      - run: npm run build:sea
        if: matrix.mode == 'sea'
        env:
          DIODE_VERSION: ${{ inputs.version }}

      - run: npm run build:selfextract
        if: matrix.mode == 'selfextract'
        env:
          DIODE_VERSION: ${{ inputs.version }}

      # Rename to the platform-specific asset name so that:
      #  - files don't clash when uploaded to one release;
      #  - the download URL stays stable (matters for nightly).
      - name: Rename binary
        shell: bash
        run: mv "${{ matrix.binary }}" "${{ matrix.asset }}"

      # Last line of defense before publishing: the asset must actually start on this
      # hardware. This is exactly what #143 lacked: a segfaulting diode-macos-x64 shipped
      # in a release because nobody ever ran the built file.
      # The self-tests inside the build scripts check the same, but here we check
      # exactly the file that goes to upload-artifact, after the rename.
      - name: Smoke — asset actually starts
        shell: bash
        run: ./${{ matrix.asset }} --version

      # Checksum sidecar: read by install.sh, the npm wrapper and
      # packaging/render.mjs (brew cask, winget manifest). The format matches
      # `sha256sum`, so `sha256sum -c` works out of the box.
      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          cat "${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error
