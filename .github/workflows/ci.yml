name: CI

# Ручной запуск — удалённый раннер тяжёлых гейтов для ветки без PR
# (`npm run ci:run -- <gate>`, scripts/ci-run.mjs; docs/TESTING.md#гейты-в-ci-без-pr).
# `token` нужен только затем, чтобы скрипт нашёл свой прогон по имени среди
# соседних; у push/PR имя пустое → GitHub ставит обычное.
run-name: "${{ github.event_name == 'workflow_dispatch' && format('ci {0} {1}', inputs.gate, inputs.token) || '' }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      gate:
        description: Какой гейт прогнать
        type: choice
        options: [all, static, test, mutation, e2e, e2e-windows]
        default: all
      base:
        description: База диффа мутационного гейта (SHA); пусто — merge-base с origin/main
        type: string
        required: false
      token:
        description: Метка прогона для поиска по имени (ставит scripts/ci-run.mjs)
        type: string
        required: false

jobs:
  # Статические гейты: типы и линт. Отдельной job'ой, а не шагом внутри `test`,
  # чтобы падение линта не прятало результат тестов (и наоборот) — обе картины
  # видны в одном прогоне.
  #
  # `npm run lint` линтует ровно те же пути, что и локально (src/ + extensions/),
  # и требует сгенерированный `settings-schema.generated.ts` только как файл на
  # диске — он закоммичен, так что билд расширений здесь не нужен.
  static:
    if: github.event_name != 'workflow_dispatch' || inputs.gate == 'all' || inputs.gate == 'static'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm install

      # continue-on-error на каждом гейте, чтобы остальные тоже отработали и PR
      # получил всю картину сразу; красным job делает шаг Gate.
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      # Оси слоёв и окружений (scripts/check-layers.mjs, docs/ARCHITECTURE.md),
      # включая подпути @tuidom/* и запрет движкового disposable.
      - name: Layers
        id: layers
        continue-on-error: true
        run: npm run valid-layers-check

      - name: Gate
        if: steps.typecheck.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.layers.outcome == 'failure'
        run: |
          echo "typecheck: ${{ steps.typecheck.outcome }}"
          echo "lint:      ${{ steps.lint.outcome }}"
          echo "layers:    ${{ steps.layers.outcome }}"
          echo 'Форматирование и сортировку импортов чинит `npm run lint:fix`, остальное — руками.'
          exit 1

  test:
    if: github.event_name != 'workflow_dispatch' || inputs.gate == 'all' || inputs.gate == 'test'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm install

      - run: npm run test:coverage

      # Постим (или обновляем) комментарий с таблицей покрытия и непокрытыми
      # строками затронутых файлов. always() — чтобы отчёт появился и когда
      # покрытие упало ниже порога и предыдущий шаг сделал job красным
      # (reportOnFailure в vitest.config.ts гарантирует, что отчёт всё равно
      # сгенерирован).
      - name: Report coverage
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2

  # Мутационный гейт на код, который тронул PR. Покрытие по устройству слепо к
  # ненаписанному: тест, проходящий по всем веткам без единого ассерта, даёт 100%
  # по всем четырём метрикам и 11% мутационного балла — замерено. Этот job ловит
  # именно такие дыры.
  #
  # `--ignoreStatic` здесь не экономия ради экономии, а условие того, чтобы гейт
  # вообще жил на PR: статические мутанты (верхнеуровневый код — таблицы,
  # регистрации команд) не сужаются per-test покрытием, и на каждого гоняется весь
  # связанный набор. Замер на #261: полный прогон 41 минута, без статики — 11:45.
  # Статику добирает ночной прогон (mutation.yml), там она с критического пути снята.
  mutation:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.gate == 'all' || inputs.gate == 'mutation'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Без полной истории `git merge-base` не работает, а на нём стоит весь
          # расчёт diff-скоупа в scripts/mutation-diff.mjs.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm install

      # Инкрементальный режим: результаты прошлого пуша этой же ветки лежат в
      # reports/stryker-incremental.json, и мутант, у которого не менялись ни код,
      # ни убивший его тест, заново не гоняется. Ключ кэша уникален на прогон
      # (кэш в Actions неизменяем), восстановление — по префиксу ветки: берётся
      # самый свежий. Первый пуш ветки идёт с нуля, как раньше.
      - name: Restore incremental mutation results
        id: incremental
        uses: actions/cache/restore@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-${{ github.head_ref || github.ref_name }}-

      # Логика самого гейта (ключ мутанта, скоуп, балл): секунды, и сломанный
      # гейт лучше узнать до получасового Stryker'а, чем по тихо-зелёному отчёту.
      - name: Gate self-test
        run: npm run test:scripts

      # continue-on-error, чтобы отчёт долетел до PR и когда балл ниже порога;
      # красным job делает последний шаг.
      # База: у PR — его base.sha, у ручного запуска — `base` из inputs, а без
      # него merge-base с main (fetch-depth: 0 приносит origin/main).
      # Лог — в артефакт: при ручном запуске комментария в PR нет.
      - name: Mutation testing
        id: mutation
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: |
          set -o pipefail
          base="${BASE:-$(git merge-base origin/main HEAD)}"
          echo "База диффа: $base"
          mkdir -p reports/mutation
          node scripts/mutation-diff.mjs --base "$base" \
            --ignoreStatic --incremental --reporters json,html,clear-text \
            2>&1 | tee reports/mutation/mutation.log

      # always(): результаты нужны следующему пушу и когда балл ниже порога —
      # выжившие перепроверяются точечно каждый прогон (scripts/mutation-diff.mjs).
      - name: Save incremental mutation results
        if: always() && hashFiles('reports/stryker-incremental.json') != ''
        uses: actions/cache/save@v4
        with:
          path: reports/stryker-incremental.json
          key: ${{ steps.incremental.outputs.cache-primary-key }}

      - name: Report mutants
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # head.sha, а не github.sha: последний — merge-коммит PR, ссылки на
          # строки в нём ведут не в те места.
          MUTATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ ! -f reports/mutation/mutation.json ]; then
            # «Нет отчёта» бывает и от пустого скоупа, и от упавшего скрипта —
            # различает их только исход, который скрипт пишет в gate.json.
            if [ "$(jq -r .outcome reports/mutation/gate.json 2>/dev/null)" = "empty-scope" ]; then
              echo "PR не трогает продуктовый код — мутировать нечего."
              exit 0
            fi
            echo "::error::Мутационный прогон не дошёл до отчёта — смотри шаг Mutation testing."
            exit 1
          fi
          {
            echo "<!-- mutation-report -->"
            echo "## Мутационное тестирование"
            echo
            node scripts/mutation-report.mjs
          } > mutation-comment.md
          cat mutation-comment.md >> "$GITHUB_STEP_SUMMARY"
          # Ручной запуск: PR может не быть — отчёт остаётся в summary и артефакте.
          if [ "${{ github.event_name }}" != pull_request ]; then exit 0; fi
          # --edit-last, чтобы пуши в PR не плодили комментарии; если предыдущего
          # нет, gh падает — тогда создаём новый.
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file mutation-comment.md --edit-last \
            || gh pr comment "${{ github.event.pull_request.number }}" \
                 --body-file mutation-comment.md

      - name: Mutation report artifact
        if: always() && hashFiles('reports/mutation/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-pr
          path: |
            reports/mutation/mutation.html
            reports/mutation/mutation.json
            reports/mutation/mutation.log
          retention-days: 14

      - name: Gate
        if: steps.mutation.outcome == 'failure'
        run: |
          echo "Мутационный балл ниже порога. Выжившие мутанты — в комментарии к PR / summary прогона."
          echo "Каждого либо убиваем тестом, либо гасим:"
          echo "  // Stryker disable next-line <мутатор>: причина"
          exit 1

  # Ручной запуск делит матрицу: `e2e` — ubuntu, `e2e-windows` — windows. Имена
  # проверок на PR (`e2e (ubuntu-latest)`, `e2e (windows-latest)`) те же.
  e2e:
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","e2e","e2e-windows"]'), inputs.gate)
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.gate == 'e2e' && '["ubuntu-latest"]' || inputs.gate == 'e2e-windows' && '["windows-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '25'

      # node-pty собирается из исходников, если для текущей версии Node нет prebuild.
      # На ubuntu нужен build-essential + python3 (на macOS они уже есть из Xcode CLT,
      # на Windows setup-node + windows-build-tools обычно достаточно).
      - name: Install build deps for node-pty (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3

      - run: npm install

      # Последовательный прогон в CI (как было до параллелизации): детерминизм
      # на общих раннерах важнее скорости — несколько SEA/PTY-процессов на слабой
      # машине дают тайминг-флейк. Параллель доступна локально (DIODE_E2E_WORKERS).
      #
      # `test:e2e` — обёртка scripts/e2e.mjs: упавшие файлы перепрогоняются вторым
      # проходом поодиночке, и job зелёный, только если второй проход зелёный.
      # Флаки (упал — потом прошёл) не прячутся: список FLAKY уходит в summary
      # job'а и аннотациями. Бинарь собирается один раз (scripts/e2e-artifacts.mjs),
      # второй проход берёт его из кэша раннера.
      #
      # Артефакта нет намеренно: пост-мортем сессии (e2e/helpers/diagnostics.ts)
      # печатается в stderr, то есть в лог job'а, а его целиком забирает
      # scripts/ci-run.mjs.
      - run: npm run test:e2e
        env:
          DIODE_E2E_WORKERS: '1'
