name: CI

# A manual run is the remote runner of the heavy gates for a branch without a PR
# (`npm run ci:run -- <gate>`, scripts/ci-run.mjs; .claude/skills/heavy-run/SKILL.md#гейт-в-ci-без-pr).
# `token` exists only so the script can find its own run by name among
# its neighbors; for push/PR the name is empty, so GitHub uses the usual one.
run-name: "${{ github.event_name == 'workflow_dispatch' && format('ci {0} {1}', inputs.gate, inputs.token) || '' }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      gate:
        description: Which gate to run
        type: choice
        options: [all, static, test, mutation, e2e, e2e-windows]
        default: all
      base:
        description: Diff base of the mutation gate (SHA); empty means merge-base with origin/main
        type: string
        required: false
      token:
        description: Run tag for finding the run by name (set by scripts/ci-run.mjs)
        type: string
        required: false

jobs:
  # Static gates: types and lint. A separate job rather than a step inside `test`,
  # so a lint failure doesn't hide the test results (and vice versa): both pictures
  # are visible in one run.
  #
  # `npm run lint` lints exactly the same paths as locally (src/ + extensions/),
  # and needs the generated `settings-schema.generated.ts` only as a file on
  # disk; it is committed, so no extension build is needed here.
  static:
    if: github.event_name != 'workflow_dispatch' || inputs.gate == 'all' || inputs.gate == 'static'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm install

      # continue-on-error on every gate so the others run too and the PR
      # gets the whole picture at once; the Gate step turns the job red.
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      # Layer and environment axes (scripts/check-layers.mjs, docs/ARCHITECTURE.md),
      # including the @tuidom/* subpaths and the ban on the engine's disposable.
      - name: Layers
        id: layers
        continue-on-error: true
        run: npm run valid-layers-check

      # First frame graph: lazy chunks (scripts/build-lazy-chunks.mjs) haven't
      # leaked into dist/main.cjs through a static import, per the esbuild metafile.
      - name: Lazy chunks
        id: lazy
        continue-on-error: true
        run: npm run lazy-chunks-check

      # Code is English, docs stay Russian: per-file Cyrillic only goes down
      # (scripts/check-cyrillic.mjs, baseline in scripts/cyrillic-baseline.json).
      - name: Cyrillic
        id: cyrillic
        continue-on-error: true
        run: npm run cyrillic-check

      # The core's V8 snapshot (SEA `useSnapshot`): main.cjs builds into a snapshot, the
      # module top level doesn't read the build environment (traps + a poisoned build),
      # and after deserialization it sees the launch environment (scripts/check-snapshot.mjs).
      # The job's node is the one the release embeds (.nvmrc, build.yml): node before 26.11
      # crashes a worker with node:net in a process from a snapshot, and the gate's probe catches that.
      - name: Snapshot
        id: snapshot
        continue-on-error: true
        run: npm run snapshot-check

      - name: Gate
        if: steps.typecheck.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.layers.outcome == 'failure' || steps.lazy.outcome == 'failure' || steps.cyrillic.outcome == 'failure' || steps.snapshot.outcome == 'failure'
        run: |
          echo "typecheck: ${{ steps.typecheck.outcome }}"
          echo "lint:      ${{ steps.lint.outcome }}"
          echo "layers:    ${{ steps.layers.outcome }}"
          echo "lazy:      ${{ steps.lazy.outcome }}"
          echo "cyrillic:  ${{ steps.cyrillic.outcome }}"
          echo "snapshot:  ${{ steps.snapshot.outcome }}"
          echo 'Formatting and import order are fixed by `npm run lint:fix`; the rest by hand.'
          exit 1

  test:
    if: github.event_name != 'workflow_dispatch' || inputs.gate == 'all' || inputs.gate == 'test'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm install

      # Go for the golang.go stock extension suites (otherwise they are skipped) + gopls cache.
      - uses: ./.github/actions/go-tools

      - run: npm run test:coverage

      # Post (or update) a comment with the coverage table and the uncovered
      # lines of the touched files. always() so the report appears even when
      # coverage fell below the threshold and the previous step turned the job red
      # (reportOnFailure in vitest.config.ts guarantees the report is still
      # generated).
      - name: Report coverage
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2

  # The mutation gate on the code the PR touched. Coverage is by design blind to
  # what isn't written: a test that walks every branch without a single assert gives 100%
  # on all four metrics and an 11% mutation score (measured). This job catches
  # exactly such holes.
  #
  # `--ignoreStatic` isn't saving for its own sake but the condition for the gate
  # to live on PRs at all: static mutants (module top level code: tables,
  # command registrations) aren't narrowed by per-test coverage, and each one runs the whole
  # related set. Measured on #261: a full run is 41 minutes, without static ones 11:45.
  # The scheduled run (mutation.yml) picks up the static ones off the critical path.
  mutation:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.gate == 'all' || inputs.gate == 'mutation'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Without the full history `git merge-base` doesn't work, and the whole
          # diff scope computation in scripts/mutation-diff.mjs rests on it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm install

      # Go for the golang.go stock extension suites (otherwise they are skipped) + gopls cache.
      - uses: ./.github/actions/go-tools

      # Incremental mode: the results of the previous push of this same branch live in
      # reports/stryker-incremental.json, and a mutant whose code and killing test
      # both haven't changed isn't rerun. The cache key is unique per run
      # (Actions caches are immutable), restore goes by the branch prefix and takes
      # the freshest one. A branch's first push starts from scratch, as before.
      - name: Restore incremental mutation results
        id: incremental
        uses: actions/cache/restore@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-${{ github.head_ref || github.ref_name }}-

      # The gate's own logic (mutant key, scope, score): seconds, and it's better to learn
      # about a broken gate before a half-hour Stryker run than from a quietly green report.
      # The same script runs the Claude Code hook tests (.claude/hooks/): bash-guard
      # parses the gate's arguments with the gate's own `parseArgs`.
      - name: Gate self-test
        run: npm run test:scripts

      # continue-on-error so the report reaches the PR even when the score is below the threshold;
      # the last step turns the job red.
      # Base: for a PR it's the first parent of the merge ref (`HEAD^1`), i.e. exactly the
      # main the checked code was built with. NOT `pull_request.base.sha`: it is
      # fixed at event time and lags if main moved on, while GitHub builds the
      # merge ref against fresh main, so other, already merged commits got into the scope
      # (#663: surviving mutants in viewsService.ts from #660).
      # For a manual run it's `base` from inputs, otherwise merge-base with main
      # (fetch-depth: 0 brings origin/main).
      # The log goes to an artifact: a manual run has no PR comment.
      - name: Mutation testing
        id: mutation
        continue-on-error: true
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          BASE: ${{ inputs.base }}
        run: |
          set -o pipefail
          if [ "$IS_PR" = "true" ]; then
            base="$(git rev-parse HEAD^1)"
          else
            base="${BASE:-$(git merge-base origin/main HEAD)}"
          fi
          echo "Diff base: $base"
          mkdir -p reports/mutation
          # Re-verification by planting runs after Stryker in the same step; the budget leaves
          # headroom under the job's timeout-minutes: the ones that don't make it are inconclusive (red).
          # Two sandboxes: a big diff left ~30 mutants without a verdict at one (~2.5 min each),
          # and the narrow per-file runs do not saturate the runner's cores.
          node scripts/mutation-diff.mjs --base "$base" \
            --ignoreStatic --incremental --reporters json,html,clear-text \
            --verify-budget 40 --verify-jobs 2 \
            2>&1 | tee reports/mutation/mutation.log

      # always(): the next push needs the results even when the score is below the threshold:
      # mutants Stryker didn't kill are re-verified by planting on every run
      # (scripts/verify-mutants.mjs).
      - name: Save incremental mutation results
        if: always() && hashFiles('reports/stryker-incremental.json') != ''
        uses: actions/cache/save@v4
        with:
          path: reports/stryker-incremental.json
          key: ${{ steps.incremental.outputs.cache-primary-key }}

      - name: Report mutants
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # head.sha, not github.sha: the latter is the PR's merge commit, and line
          # links into it point to the wrong places.
          MUTATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ ! -f reports/mutation/mutation.json ]; then
            # "No report" comes both from an empty scope and from a crashed script;
            # only the outcome the script writes to gate.json tells them apart.
            if [ "$(jq -r .outcome reports/mutation/gate.json 2>/dev/null)" = "empty-scope" ]; then
              echo "The PR doesn't touch product code: nothing to mutate."
              exit 0
            fi
            echo "::error::The mutation run didn't get to a report; see the Mutation testing step."
            exit 1
          fi
          {
            echo "<!-- mutation-report -->"
            echo "## Mutation testing"
            echo
            node scripts/mutation-report.mjs
          } > mutation-comment.md
          cat mutation-comment.md >> "$GITHUB_STEP_SUMMARY"
          # Manual run: there may be no PR, so the report stays in the summary and the artifact.
          if [ "${{ github.event_name }}" != pull_request ]; then exit 0; fi
          # --edit-last so pushes to the PR don't pile up comments; if there is no previous
          # one, gh fails, and then we create a new one.
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file mutation-comment.md --edit-last \
            || gh pr comment "${{ github.event.pull_request.number }}" \
                 --body-file mutation-comment.md

      - name: Mutation report artifact
        if: always() && hashFiles('reports/mutation/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-pr
          path: |
            reports/mutation/mutation.html
            reports/mutation/mutation.json
            reports/mutation/mutation.log
            reports/mutation/verdict.json
            reports/mutation/gate.json
          retention-days: 14

      - name: Gate
        if: steps.mutation.outcome == 'failure'
        run: |
          echo "The mutation gate is red: real surviving mutants (real) or mutants without a verdict;"
          echo "classes and reasons are in the PR comment / run summary, triage in docs/MUTATION.md."
          echo "real: kill with a test or suppress: // Stryker disable next-line <mutator>: reason"
          echo "phantom: the gate has already exposed them itself, no need to fix or suppress them."
          exit 1

  # A manual run splits the matrix: `e2e` is ubuntu, `e2e-windows` is windows. The check
  # names on PRs (`e2e (ubuntu-latest)`, `e2e (windows-latest)`) stay the same.
  e2e:
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","e2e","e2e-windows"]'), inputs.gate)
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.gate == 'e2e' && '["ubuntu-latest"]' || inputs.gate == 'e2e-windows' && '["windows-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The same node the release build embeds (build.yml): e2e runs the SEA binary.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # node-pty builds from source when there is no prebuild for the current Node version.
      # Ubuntu needs build-essential + python3 (macOS already has them from Xcode CLT,
      # on Windows setup-node + windows-build-tools is usually enough).
      - name: Install build deps for node-pty (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3

      - run: npm install

      # Go for e2e goLsp and the go-lsp scenario (extension host e2e is Linux only).
      - if: runner.os == 'Linux'
        uses: ./.github/actions/go-tools

      # Sequential run in CI (as before parallelization): determinism on shared
      # runners matters more than speed, since several SEA/PTY processes on a weak
      # machine produce timing flakes. Parallelism is available locally (DIODE_E2E_WORKERS).
      #
      # `test:e2e` is the scripts/e2e.mjs wrapper: failed files are rerun one by one
      # in a second pass, and the job is green only if the second pass is green.
      # Flakes (failed, then passed) aren't hidden: the FLAKY list goes to the job
      # summary and to annotations. The binary is built once (scripts/e2e-artifacts.mjs),
      # and the second pass takes it from the runner cache.
      #
      # No artifact on purpose: the session post-mortem (e2e/helpers/diagnostics.ts)
      # is printed to stderr, i.e. to the job log, which scripts/ci-run.mjs
      # fetches whole.
      - run: npm run test:e2e
        env:
          DIODE_E2E_WORKERS: '1'

      # Startup perf gate (e2e/bench/startupBudget.bench.ts): the "our ms" budget for
      # small is calibrated on the ubuntu runner, hence only here. The binary comes from
      # the cache test:e2e has just built.
      - name: Startup budget (small)
        if: runner.os == 'Linux'
        run: npm run test:perf:startup

      # Big-file perf gate (e2e/bench/xlargeBudget.bench.ts): xlarge (13 MB) to text and the
      # keystroke after the background tokenization has settled. Calibrated on the same runner.
      - name: Open and keystroke budget (xlarge)
        if: runner.os == 'Linux'
        run: npm run test:perf:xlarge

      # Giant-file perf gate (e2e/bench/hugeBudget.bench.ts): log500m (497 MB) opens read-only on
      # disk — to text, the line index, peak RSS. 500 MB of the runner's disk; log2g is not gated.
      - name: Giant file budget (log500m)
        if: runner.os == 'Linux'
        run: npm run test:perf:huge
