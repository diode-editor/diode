name: Nightly

# Ночная сборка на статическом теге `nightly`: релиз обновляется подменой
# ассетов (upload --clobber), сам тег не двигается — иначе force-push тега
# ломал бы `git fetch` у всех чекаутов («would clobber existing tag»).
# URL на скачивание артефактов при этом остаётся неизменным.
on:
  schedule:
    # Каждую ночь в 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Вычисляем short-hash заранее, чтобы зашить его в бинарник через build.yml.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  # Та же переиспользуемая сборка, что и у стабильного релиза.
  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: nightly-${{ needs.prepare.outputs.short_sha }}

  nightly:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          short_sha="${{ needs.prepare.outputs.short_sha }}"
          title="Nightly ($short_sha)"
          notes="Ночная сборка из коммита $short_sha ($(date -u +'%Y-%m-%d %H:%M') UTC)."

          if gh release view nightly >/dev/null 2>&1; then
            # Обычный путь: релиз есть — обновляем метаданные и подменяем ассеты.
            # Тег не трогаем, поэтому fetch у чекаутов больше не конфликтует.
            gh release edit nightly --prerelease --title "$title" --notes "$notes"
            gh release upload nightly artifacts/* --clobber
          else
            # Первый запуск (или релиз удалили руками): gh создаст релиз на
            # существующем теге nightly, а если тега нет — лёгкий тег на HEAD.
            gh release create nightly \
              --prerelease \
              --title "$title" \
              --notes "$notes" \
              artifacts/*
          fi
