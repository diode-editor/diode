name: Nightly

# Nightly build on the static `nightly` tag: the release is updated by replacing
# its assets (upload --clobber) and the tag itself never moves; a force-pushed tag
# would break `git fetch` in every checkout ("would clobber existing tag").
# Download URLs for the assets stay the same.
on:
  schedule:
    # Every night at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Compute the short hash up front so build.yml can bake it into the binary.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  # The same reusable build as the stable release.
  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: nightly-${{ needs.prepare.outputs.short_sha }}

  nightly:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          short_sha="${{ needs.prepare.outputs.short_sha }}"
          title="Nightly ($short_sha)"
          notes="Nightly build from commit $short_sha ($(date -u +'%Y-%m-%d %H:%M') UTC)."

          if gh release view nightly >/dev/null 2>&1; then
            # Usual path: the release exists, so update its metadata and replace the assets.
            # The tag stays put, so fetch in checkouts doesn't conflict.
            gh release edit nightly --prerelease --title "$title" --notes "$notes"
            gh release upload nightly artifacts/* --clobber
          else
            # First run (or the release was deleted by hand): gh creates the release on
            # the existing nightly tag, or a lightweight tag on HEAD if there is none.
            gh release create nightly \
              --prerelease \
              --title "$title" \
              --notes "$notes" \
              artifacts/*
          fi
