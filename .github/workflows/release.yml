name: Release

# Stable (versioned) release: triggered by pushing a tag like v1.2.3.
# The tag is usually created via bump-version.yml.
#
# Once the GitHub release is published, the same tag goes out to the channels (packaging/README.md):
#   packages — .deb + flat apt repository metadata, as assets of this same release;
#   npm      — @diode-editor/diode (a thin wrapper that downloads the binary from the release; OIDC, no token);
#   brew     — a cask in diode-editor/homebrew-tap (not a formula: a formula without a bottle requires CLT on macOS);
#   winget   — a PR to microsoft/winget-pkgs;
#   site     — the version in the diode-editor.github.io footer (site-version.yml).
# Each channel is a separate job: a failed npm doesn't block brew. A channel is silently skipped
# when its secret isn't set (env HAS_* below), so a release works without all the keys.
# The exception is site: without SITE_PAT it fails, so a stale site is visible.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  HAS_APT_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY != '' }}
  HAS_TAP_TOKEN: ${{ secrets.REPOSITORY_PAT != '' }}
  HAS_WINGET_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}

jobs:
  # Build the binaries with the reusable workflow.
  build:
    uses: ./.github/workflows/build.yml
    with:
      # Bake in the version from the tag (vX.Y.Z); build.yml strips the leading `v`.
      version: ${{ github.ref_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff needs the full history to build the changelog.
          fetch-depth: 0

      - name: Generate Changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          # Commit grouping and filtering live in cliff.toml (repo root):
          # only user-facing editor changes make it into the changelog.
          config: cliff.toml
          args: --latest --strip all

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: diode ${{ github.ref_name }}
          body: ${{ steps.cliff.outputs.content }}
          files: artifacts/*

  # .deb for amd64/arm64 and a flat apt repository: Packages/InRelease are release
  # assets, and sources.list points at releases/latest/download (packaging/apt/build-repo.sh).
  # Packages also lists all past versions with links into their releases (fetch-history.sh).
  packages:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build .deb
        run: |
          version="${GITHUB_REF_NAME#v}"
          packaging/deb/build-deb.sh artifacts/diode-linux-x64   amd64 "$version" repo
          packaging/deb/build-deb.sh artifacts/diode-linux-arm64 arm64 "$version" repo
          ls -la repo

      # The secret holds the armored key as one line of base64 (the way
      # packaging/apt/gen-key.sh prints it); the key passphrase is a separate secret.
      - name: Import apt signing key
        if: env.HAS_APT_KEY == 'true'
        run: printf '%s' "$APT_GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}

      # Past versions as stanzas from the Packages of past releases, Filename via ../../download/vX/
      # (packaging/apt/fetch-history.sh): apt install diode=<version> and rollback work.
      - name: Collect previous releases for apt
        if: env.HAS_APT_KEY == 'true'
        run: packaging/apt/fetch-history.sh "$RUNNER_TEMP/apt-history" "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build apt repository metadata
        if: env.HAS_APT_KEY == 'true'
        # apt-ftparchive (the apt-utils package) is gone from the ubuntu-latest image, so install it explicitly.
        run: |
          command -v apt-ftparchive >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends apt-utils; }
          packaging/apt/build-repo.sh repo
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          APT_HISTORY: ${{ runner.temp }}/apt-history

      - name: Upload to release
        run: gh release upload "$GITHUB_REF_NAME" repo/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tokenless publishing: npm Trusted Publishing (OIDC). On npmjs.com the package has
  # the Trusted Publisher "GitHub Actions: diode-editor/diode, release.yml" configured;
  # npm >= 11.5.1 exchanges the id-token for publish rights, and provenance is added automatically.
  # The package's first version is published by hand (packaging/README.md): a Trusted Publisher
  # can be configured only on an existing package.
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Publish @diode-editor/diode
        working-directory: packaging/npm
        run: |
          npm --version
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npm publish --access public

  brew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_TAP_TOKEN == 'true'

      - uses: actions/download-artifact@v4
        if: env.HAS_TAP_TOKEN == 'true'
        with:
          path: artifacts
          merge-multiple: true

      - name: Render formula
        if: env.HAS_TAP_TOKEN == 'true'
        run: node packaging/render.mjs --version "${GITHUB_REF_NAME#v}" --sums artifacts --out packaging/out

      - uses: actions/checkout@v4
        if: env.HAS_TAP_TOKEN == 'true'
        with:
          repository: diode-editor/homebrew-tap
          token: ${{ secrets.REPOSITORY_PAT }}
          path: tap

      - name: Push cask to tap
        if: env.HAS_TAP_TOKEN == 'true'
        working-directory: tap
        run: |
          mkdir -p Casks
          cp ../packaging/out/brew/Casks/diode.rb Casks/diode.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/diode.rb
          # A formula with the same name would take over `brew install` (and hit the CLT requirement).
          git rm -q --ignore-unmatch Formula/diode.rb
          git diff --cached --quiet && { echo "cask unchanged"; exit 0; }
          git commit -m "diode ${GITHUB_REF_NAME}"
          git push

  # Updates the existing DiodeEditor.Diode package: wingetcreate forks
  # microsoft/winget-pkgs and opens a PR itself. The first submission is by hand from packaging/out/winget
  # (see packaging/README.md); until it is merged this job is expected to fail.
  winget:
    needs: release
    runs-on: windows-latest
    steps:
      - name: Submit to winget-pkgs
        if: env.HAS_WINGET_TOKEN == 'true'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $url = "https://github.com/diode-editor/diode/releases/download/$env:GITHUB_REF_NAME/diode-windows-x64.exe"
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update DiodeEditor.Diode --urls $url --version $version --submit --token $env:WINGET_TOKEN
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

  # The version on the landing page. A separate workflow so it can be republished by hand.
  site:
    needs: release
    uses: ./.github/workflows/site-version.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      SITE_PAT: ${{ secrets.SITE_PAT }}
