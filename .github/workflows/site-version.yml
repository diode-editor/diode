name: Site version

# The diode version in the footer of the diode-editor.github.io landing page. Called from
# release.yml as a separate `site` job after the release is published: if it fails the job
# is red, but the release and the other channels no longer depend on it. By hand
# (workflow_dispatch): republish the version without a new release, e.g. after fixing the token.
#
# The version in the site's index.html is static; the site repo's scripts/set-diode-version.mjs
# rewrites it, we commit to main, and GitHub Pages deploys on its own.
#
# The SITE_PAT secret is a fine-grained PAT for the single diode-editor.github.io repository,
# Contents: Read and write. Unlike the channels in release.yml, the job doesn't silently skip
# without the secret but fails: otherwise nobody would notice a stale site.
on:
  workflow_call:
    inputs:
      version:
        description: "Release tag, vX.Y.Z"
        required: true
        type: string
    secrets:
      SITE_PAT:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, vX.Y.Z"
        required: true
        type: string

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        run: |
          if [ -z "$SITE_PAT" ]; then
            echo "::error::secret SITE_PAT is not set — site version not updated (packaging/README.md#сайт-версия-на-лендинге)"
            exit 1
          fi
        env:
          SITE_PAT: ${{ secrets.SITE_PAT }}

      - uses: actions/checkout@v4
        with:
          repository: diode-editor/diode-editor.github.io
          token: ${{ secrets.SITE_PAT }}
          path: site

      - name: Commit version to site
        working-directory: site
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/set-diode-version.mjs "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo "site already shows $VERSION"; exit 0; }
          git commit -m "chore(site): diode ${VERSION}"
          # The site's registry workflow commits to the same main: on a race, pull and retry.
          for attempt in 1 2 3; do
            git push && exit 0
            sleep $((attempt * 5))
            git pull --rebase
          done
          exit 1
