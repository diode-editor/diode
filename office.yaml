# yaml-language-server: $schema=https://raw.githubusercontent.com/tihonove/agent-office/main/packages/shared/manifest.schema.json
#
# Офис агентов для diode. Движок — @tihonove/agent-office; он не знает слов «баг», «итерация» и «сверка»:
# всё, что ниже, — объявления проекта. Как это запускать и чем управляет человек — office/README.md.
#
#   npm run office            поднять офис на этом репозитории → http://127.0.0.1:4700
#   npm run office:dry        прогнать петлю на заглушках, без моделей и денег
#
# Любая постановка человека входит одной дверью — заявкой. Дальше диспетчер разводит её по трём курсам:
#
#   баг      новая ─диспетчер→ к подтверждению ─тестировщик-баг (закрепляет падающим тестом)→ к реализации
#   фича     новая ─диспетчер→ к анализу ─аналитик→ согласование ─человек: «делаем»→ к реализации
#   цель     новая ─диспетчер→ к разбору ─декомпозитор→ разбита (учётный узел; дети — заявки, по три за раз)
#
# Дальше курс общий, и он одинаков для бага и для фичи:
#
#   к реализации ─реализатор→ к сверке ─сверщик (калька с vscode)→ к тестированию
#   ─тестировщик (видит только данные аналитика)→ к вливанию ─интегратор→ в итерации
#
# Сверщик и тестировщик возвращают заявку реализатору сколько угодно раз — пока не скажут «годится».
#
# Итерация — это ветка `iteration/NN` и её журнал `docs/iterations/NN.md`. Заявка ложится в неё вливанием
# и висит в состоянии «в итерации», пока человек не решит её судьбу. Закрытие итерации человек вбрасывает
# такой же заявкой («закрыть итерацию 05»):
#
#   к сборке ─сборщик→ приёмка ─человек: «вливать»→ к релизу ─релизёр→ к ретроспективе ─ретроспектива→ готово
#
#   «пересобрать» на приёмке возвращает итерацию сборщику: PR пересобирается без того, что человек вернул.
#   Вернуть заявку из сборки — ответить «вернуть» на её собственном вопросе: откатчик снимет её с ветки,
#   а сама заявка уедет к аналитику. Любая доработка идёт через постановку, а не мимо неё.
#
# Человек в контуре трижды и все три раза обязательно: согласует постановку, решает судьбу каждой влитой
# заявки и принимает собранный PR со ссылкой на сборку. Его молчание не вливает в main ничего.

inbox: { kind: заявка, state: новая }

kinds:
  заявка:
    states:
      - новая                 # ждёт диспетчера
      - маршрутизация         # диспетчер решает курс

      - к подтверждению       # баг: ждёт тестировщика
      - подтверждение         # тестировщик воспроизводит и закрепляет тестом

      - к анализу             # фича: ждёт аналитика
      - анализ
      - согласование          # человек: что делать будем

      - к разбору             # цель: ждёт декомпозитора
      - разбор
      - разбита               # учётный узел: работа идёт в детях

      - к реализации
      - реализация
      - к сверке              # калька с vscode
      - сверка
      - к тестированию
      - тестирование
      - к вливанию            # в ветку итерации
      - вливание

      - в итерации            # человек: принимаем эту заявку в релиз?
      - к откату              # человек вернул заявку из сборки
      - откат

      - к сборке              # заявка-итерация: собрать PR
      - сборка
      - приёмка               # человек: смотрит PR и сборку
      - к релизу
      - релиз
      - к ретроспективе
      - ретроспектива

      - готово
      - отклонена
      - отложена              # человек промолчал или отложил сам; вернуть — вызвать роль руками
    closed: [готово, отклонена, отложена]

resources:
  # Ёмкости, которые агенты делят. `кодящий` собирает бинарник, гоняет e2e и мутационный гейт — двое таких
  # на одной машине голодают по CPU и дают флаки (см. AGENTS.md про параллельные прогоны). Поэтому машина одна.
  машина: 1

executors:
  # args идут в claude насквозь; офис их не толкует. Каталог назначения (проекция и out/) офис подключает
  # сам через --add-dir; наш повторный --add-dir к нему добавляется, а не заменяет его — проверено.

  лёгкий:                     # решения без кода: маршрут заявки
    type: claude
    model: haiku
    args: [--permission-mode, acceptEdits, --allowedTools, Read, Glob, Grep, Write, Edit, 'Bash(git log *)', 'Bash(git show *)', 'Bash(rg *)']

  читающий:                   # анализ и разбор цели: читают много, кода не пишут и тестов не гоняют
    type: claude
    model: opus
    args: [--permission-mode, acceptEdits, --allowedTools, Read, Glob, Grep, Write, Edit, WebFetch, Task, TodoWrite, 'Bash(git log *)', 'Bash(git show *)', 'Bash(git diff *)', 'Bash(git branch *)', 'Bash(rg *)', 'Bash(ls *)', 'Bash(cat *)']

  сверяющий:                  # сверка с эталоном: ходит в клон vscode (путь печатает scripts/vscode-ref.mjs)
    type: claude
    model: opus
    args: [--permission-mode, acceptEdits, --add-dir, /workspaces/vscode, --allowedTools, Read, Glob, Grep, Write, Edit, Task, TodoWrite, 'Bash(git log *)', 'Bash(git show *)', 'Bash(git diff *)', 'Bash(rg *)', 'Bash(ls *)', 'Bash(cat *)', 'Bash(node scripts/vscode-ref.mjs*)', 'Bash(npm run valid-layers-check)']

  кодящий:                    # реализация и тестирование: может всё, что может агент у клавиатуры
    type: claude
    model: opus
    takes: { машина: 1 }      # тяжёлый: собирает и гоняет тесты — работает строго один на весь офис
    args: [--permission-mode, acceptEdits, --add-dir, /workspaces/tuidom/tuidom, --allowedTools, Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, TodoWrite]

  штурман:                    # ветки, сборка, релиз: git и gh, кода не пишет
    type: claude
    model: sonnet
    args: [--permission-mode, acceptEdits, --allowedTools, Bash, Read, Glob, Grep, Write, Edit, WebFetch, Task, TodoWrite]

areas:                        # карта областей: офис её не толкует — кладёт в проекцию, чтобы роли говорили об одном
  база: [src/vs/base/**]
  платформа: [src/vs/platform/**]
  редактор: [src/vs/editor/**]
  воркбенч: [src/vs/workbench/**]
  расширения: [src/vs/workbench/api/**, src/vscode-dts/**, extensions/**]
  приложение: [src/vs/diode/**]
  тесты: [e2e/**, src/TestUtils/**]
  сборка: [scripts/**, .github/workflows/**, tsup.config.ts, vitest.config.ts, stryker.config.json]
  доки: [docs/**, AGENTS.md, GOAL.md]
  офис: [office.yaml, office/**]

roles:

  # ── Вход: куда пойдёт заявка ────────────────────────────────────────────────────────────────────────

  диспетчер:
    executor: лёгкий
    prompt: office/roles/диспетчер.md
    when: { kind: заявка, state: новая }
    needs: [описание]
    sees: [{ kind: '*', from: [self, ancestors] }]
    arrows:
      start: маршрутизация
      outcomes: { баг: к подтверждению, фича: к анализу, цель: к разбору, итерация: к сборке, отказ: отклонена }

  # ── Цель: разбить на заявки, каждая из которых видна человеку по отдельности ────────────────────────

  декомпозитор:
    executor: читающий
    prompt: office/roles/декомпозитор.md
    when: { kind: заявка, state: к разбору }
    needs: [описание]
    sees: [{ kind: '*', from: [self, ancestors] }]
    arrows:
      start: разбор
      outcomes: { разбито: разбита, отказ: отклонена }

  # ── Фича: что делать будем. Всё, что решил аналитик, подтверждает человек ───────────────────────────

  аналитик:
    executor: читающий
    prompt: office/roles/аналитик.md
    when: { kind: заявка, state: к анализу }
    needs: [описание]
    sees: [{ kind: '*', from: [self, ancestors] }]
    arrows:
      start: анализ
      outcomes: { готово: согласование, отказ: отклонена }

  # ── Баг: подтвердить и закрепить падающим тестом ────────────────────────────────────────────────────

  тестировщик-баг:
    executor: кодящий
    prompt: office/roles/тестировщик-баг.md
    when: { kind: заявка, state: к подтверждению }
    needs: [описание]
    sees: [{ kind: '*', from: [self, ancestors] }]
    arrows:
      start: подтверждение
      outcomes: { подтверждён: к реализации, не воспроизводится: отклонена, нужен анализ: к анализу }

  # ── Реализация: по согласованной постановке, в своём worktree ───────────────────────────────────────

  реализатор:
    executor: кодящий
    prompt: office/roles/реализатор.md
    when: { kind: заявка, state: к реализации }
    needs: [критерий, область]           # зрелость: без критерия готовности не начинаем
    sees:
      - { kind: постановка, from: [self, ancestors] }
      - { kind: подтверждение }           # баг: как воспроизвести и каким тестом закреплён
      - { kind: сверка }                  # что не так с устройством кода
      - { kind: замечания }               # что не прошло тестирование или вливание
      - { kind: отчёт }                   # свой прошлый отчёт — при доработке
    arrows:
      start: реализация
      outcomes: { готово: к сверке }

  # ── Сверка: насколько код лёг по-vscode'овски ───────────────────────────────────────────────────────

  сверщик:
    executor: сверяющий
    prompt: office/roles/сверщик.md
    when: { kind: заявка, state: к сверке }
    sees:
      - { kind: постановка, from: [self, ancestors] }
      - { kind: отчёт }
      - { kind: сверка }                  # свою прошлую сверку — при повторном заходе
    arrows:
      start: сверка
      outcomes: { годится: к тестированию, вернуть: к реализации }

  # ── Тестирование: только по данным аналитика, в код реализатора не смотрит ──────────────────────────

  тестировщик:
    executor: кодящий
    prompt: office/roles/тестировщик.md
    when: { kind: заявка, state: к тестированию }
    sees:
      - { kind: постановка, from: [self, ancestors] }
      - { kind: подтверждение }
    arrows:
      start: тестирование
      outcomes: { годится: к вливанию, доработать: к реализации }

  # ── Ветка итерации: положить, снять ─────────────────────────────────────────────────────────────────

  интегратор:
    executor: штурман
    takes: { машина: 1 }      # `iteration.mjs verify` — это npm ci + lint + typecheck + test на ветке итерации:
                              # роль лёгкая, а работа тяжёлая. Доля роли перекрывает долю исполнителя.
    prompt: office/roles/интегратор.md
    when: { kind: заявка, state: к вливанию }
    sees: [{ kind: отчёт }, { kind: испытание }, { kind: постановка, from: [self, ancestors] }]
    arrows:
      start: вливание
      outcomes: { влито: в итерации, не влилось: к реализации }

  откатчик:
    executor: штурман
    prompt: office/roles/откатчик.md
    when: { kind: заявка, state: к откату }
    sees: [{ kind: вливание }, { kind: отчёт }]
    arrows:
      start: откат
      outcomes: { отозвано: к анализу, не откатилось: отложена }

  # ── Итерация: собрать PR, влить, оглянуться назад ───────────────────────────────────────────────────

  сборщик:
    executor: штурман
    prompt: office/roles/сборщик.md
    when: { kind: заявка, state: к сборке }
    sees: [{ kind: '*' }]
    arrows:
      start: сборка
      outcomes: { собрано: приёмка, нечего собирать: отклонена }

  релизёр:
    executor: штурман
    prompt: office/roles/релизёр.md
    when: { kind: заявка, state: к релизу }
    sees: [{ kind: сборка }]
    arrows:
      start: релиз
      outcomes: { влито: к ретроспективе, не влилось: к сборке }

  ретроспектива:
    executor: кодящий             # читает журнал, но правит office.yaml и вливает ветку — нужны руки
    prompt: office/roles/ретроспектива.md
    when: { kind: заявка, state: к ретроспективе }
    sees: [{ kind: '*' }]
    arrows:
      start: ретроспектива
      outcomes: { готово: готово }

transitions:
  # согласование постановки
  - { kind: заявка, from: согласование, to: к реализации, when: { answer: { request: постановка, is: делаем } } }
  - { kind: заявка, from: согласование, to: к анализу,    when: { answer: { request: постановка, is: переделать } } }
  - { kind: заявка, from: согласование, to: отклонена,    when: { answer: { request: постановка, is: не делаем } } }
  - { kind: заявка, from: согласование, to: отложена,     when: { answer: { request: постановка, is: отложить } } }

  # судьба влитой заявки: остаётся в релизе или снимается с ветки
  - { kind: заявка, from: в итерации, to: готово,   when: { answer: { request: приёмка-заявки, is: принять } } }
  - { kind: заявка, from: в итерации, to: к откату, when: { answer: { request: приёмка-заявки, is: вернуть } } }

  # приёмка собранного PR
  - { kind: заявка, from: приёмка, to: к релизу, when: { answer: { request: приёмка-итерации, is: вливать } } }
  - { kind: заявка, from: приёмка, to: к сборке, when: { answer: { request: приёмка-итерации, is: пересобрать } } }
  - { kind: заявка, from: приёмка, to: отложена, when: { answer: { request: приёмка-итерации, is: отложить } } }

  # учётный узел цели закрывается по детям
  - { kind: заявка, from: разбита, to: готово, when: { children: { all: [готово, отклонена, отложена] } } }

spawns:
  # Декомпозитор разбивает цель артефактом «разбиение». Дети входят той же дверью, что и заявки человека, —
  # через диспетчера: среди подзадач цели бывают и баги. Одновременно открыто не больше трёх.
  - { artifact: разбиение, kind: заявка, state: новая, requires: [описание], maxOpen: 3 }

requests:
  - id: постановка
    when: { kind: заявка, state: согласование }
    question: >-
      Аналитик написал постановку — она на карточке узла, артефакт «постановка». Проверь список пользовательских
      сценариев: по нему будет тестировать тестировщик, и ничего, кроме него, он не увидит. Что делать будем?
      Для «переделать» сначала запиши узлу поле «замечания» — аналитик его прочитает.
    options: [делаем, переделать, не делаем, отложить]
    default: отложить         # молчание ничего не запускает. Вернуть отложенную: вызвать роль «аналитик» руками
    deadline: 3d

  - id: приёмка-заявки
    when: { kind: заявка, state: в итерации }
    question: >-
      Заявка влита в ветку итерации и поедет в её PR. Принимаем в релиз?
      Ответить можно когда угодно — удобнее всего, когда сборщик соберёт PR со ссылкой на сборку.
      «Вернуть» снимет заявку с ветки и отправит её к аналитику; перед этим запиши узлу поле «замечания».
    options: [принять, вернуть]
    default: принять          # влитое молчанием не выкидывается; в main его всё равно пустит только приёмка итерации
    deadline: 30d

  - id: приёмка-итерации
    when: { kind: заявка, state: приёмка }
    question: >-
      Итерация собрана: ссылки на PR и на сборку — в артефакте «сборка» на карточке узла. Принимаем?
      Чтобы выкинуть из релиза часть работы, сначала ответь «вернуть» на вопросах тех заявок,
      потом здесь — «пересобрать»: PR пересоберётся без них.
    options: [вливать, пересобрать, отложить]
    default: отложить         # молчание в main ничего не вливает
    deadline: 7d

askDeadline: 2d
